{% extends "base.html" %}
{% block content %}
<h1>Payroll History</h1>
<div class="table-wrap">
<table>
<thead><tr><th>Month</th><th>Year</th><th>Created On</th><th>Action</th></tr></thead>
<tbody>
{% for r in runs %}
<tr><td>{{ r.payroll_month }}</td><td>{{ r.payroll_year }}</td><td>{{ r.created_on }}</td>
<td>
<a class="button small" href="{{ url_for('payroll_run', run_id=r.id) }}">View</a>
<a class="button small" href="{{ url_for('payroll_export', run_id=r.id) }}">Download Excel</a>
<a class="button small" href="{{ url_for('payroll_payslips', run_id=r.id) }}">Download Payslips</a>
</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
