<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>School Payroll</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">School Payroll</div>
  <nav>
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('employees') }}">Employees</a>
    <a href="{{ url_for('salary_master') }}">Salary Master</a>
    <a href="{{ url_for('import_page') }}">Import SAP</a>
    <a href="{{ url_for('payroll') }}">Monthly Payroll</a>
    <a href="{{ url_for('payroll_history') }}">Payroll History</a>
  </nav>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
